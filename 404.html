  <body>
    <div id="root"></div>
    <script type="module" src="./assets/main-AOV3VQGQ.js"></script>
    <!-- Garde-fou : si cette page a été déposée telle quelle sur Netlify/Vercel
         (au lieu du contenu de dist/ ou deploy/), l'application ne démarre pas
         (le script /src/main.tsx est introuvable). On l'explique clairement
         plutôt que d'afficher une page vide. Inactif en développement normal. -->
    <script>
      (function () {
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return; // l'app a démarré
          var err = document.createElement('div');
          err.setAttribute('style',
            'position:fixed;inset:0;z-index:99999;background:#f8fafc;color:#0f172a;' +
            'font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;' +
            'justify-content:center;padding:24px;text-align:center');
          err.innerHTML =
            '<div style="max-width:520px">' +
            '<div style="font-size:44px">⚠️</div>' +
            '<h1 style="font-size:20px;margin:12px 0 8px">Ce n\'est pas l\'application</h1>' +
            '<p style="font-size:14px;color:#475569;line-height:1.6">' +
            'Vous avez publié le <b>dossier source</b> du projet au lieu de l\'application construite.<br>' +
            'L\'application réelle se trouve dans le dossier <b>deploy/</b> (ou dist/) : ' +
            'ouvrez ce dossier et déposez son <b>contenu</b> sur ' +
            '<b>app.netlify.com/drop</b> ou <b>vercel.com/drag-drop</b>.</p>' +
            '<p style="font-size:12px;color:#94a3b8">Astuce : dans le dossier de l\'application, ' +
            'exécutez <code style="background:#e2e8f0;padding:2px 6px;border-radius:4px">npm run deploy:check</code> ' +
            'pour préparer la publication.</p>' +
            '</div>';
          document.body.appendChild(err);
        }, 3000);
      })();
    </script>
  </body>
</html>
